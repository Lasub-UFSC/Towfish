<!DOCTYPE html>
<html>

<head>
    <title>Towfish viewer</title>

<link rel="icon" href="assets/Logo-LaSub-coloridorido-150x150.png" sizes="32x32">
<link rel="icon" href="assets/Logo-LaSub-coloridorido-300x300.png" sizes="192x192">

  <link rel="stylesheet" crossorigin href="assets/index-DYWewWjL.css">
</head>

<body>
    <canvas id="threeJsCanvas"></canvas>

    <div id="info">
        <div id="controls">

            <div class="control-group">
                <label>Pitch:</label>
                <strong>
                    <span id="pitchText">0.0</span>&deg;
                </strong>
            </div>
            
            <div class="control-group">
                <label>Roll:</label>
                <strong>
                    <span id="rollText">0.0</span>&deg;
                </strong>
            </div>
            
            <div class="control-group">
                <label>Depth:</label>
                <strong>
                    <span id="depthText">0.0</strong>m
                    </strong>
                </div>

            </div>
            <div id="depthBar">
                <strong>100m</strong>
                    <div id="outerDepthBar">
                        <div id="innerDepthBar"></div>
                    </div>
                <strong>0m</strong>
            </div>
    </div>


</body>

</html>
